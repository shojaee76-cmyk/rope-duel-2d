<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAT DUEL - live rope fight</title>
<meta name="description" content="Control Sultan Bigotes on a physical live-tape rope and fight Don Gato with strike, guard and parry.">
<link rel="stylesheet" href="catduel.css">
</head>
<body>
<canvas id="stage" aria-label="Sultan Bigotes and Don Gato duel on a live-tape rope"></canvas>

<header class="hud" aria-label="Duel status">
  <section class="fighter player" id="playerPanel">
    <div class="identity"><span id="playerName">SULTAN</span><b>YOU</b></div>
    <div class="health"><i id="playerHp"></i></div>
  </section>
  <section class="centerHud">
    <div class="brand">CAT DUEL</div>
    <div class="round">ROUND <b id="round">1</b></div>
    <div class="price" id="price">---- <small>USDT / BTC</small></div>
    <div class="tape"><span id="flow">CONNECTING TAPE</span><span id="provider">SIMULATED</span></div>
  </section>
  <section class="fighter rival" id="rivalPanel">
    <div class="identity"><b>TAPE</b><span id="rivalName">DON GATO</span></div>
    <div class="health"><i id="rivalHp"></i></div>
  </section>
</header>

<div class="intent" id="intent" aria-live="polite"><span id="actionPrompt">STRIKE DON GATO</span></div>

<footer class="controls">
  <button id="strike" type="button"><b>STRIKE</b><span>J / SPACE</span></button>
  <button id="guard" type="button"><b>GUARD</b><span>K / SHIFT</span></button>
  <button id="parry" type="button"><b>PARRY</b><span>L / E</span></button>
</footer>

<div class="stats" aria-label="Round statistics">
  <span><b id="hitCount">0</b> HITS</span>
  <span><b id="blockCount">0</b> BLOCKS</span>
  <span><b id="streak">0</b> STREAK</span>
</div>

<div class="overlay" id="overlay" hidden>
  <p class="verdict" id="verdict">ROUND WON</p>
  <p class="summary" id="summary">You cut through the tape.</p>
  <button id="again" type="button">FIGHT AGAIN</button>
</div>

<p class="boot" id="boot">WAKING THE CATS</p>
<script type="module" src="catduel.js"></script>
</body>
</html>
