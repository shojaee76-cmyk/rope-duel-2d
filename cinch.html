<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CINCH THE BUNDLE - tie it shut, pull to test</title>
<meta name="description" content="A tactile drawstring bundle: cross the red tail through the pale tail, cinch it shut, and pull to test the hold.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="cinch.css">
</head>
<body>
<main class="cinch-app">
  <section class="cinch-stage" aria-label="Drawstring bundle cinch test">
    <canvas id="cinch" aria-label="A soft courier bundle with a pale fixed tail and a red working tail. Drag the red tail across and through the pale tail, then pull right to test the cinch."></canvas>
  </section>
  <aside class="cinch-dock" aria-label="Cinch instructions and result">
    <header class="brand">
      <p class="eyebrow">PACKING STUDY / 02</p>
      <h1>CINCH <span>THE BUNDLE</span></h1>
    </header>
    <section class="brief" aria-live="polite">
      <p class="instruction" id="instruction">DRAG THE RED TAIL</p>
      <p class="detail" id="detail">Cross the pale tail, feed the red tail through, and pull.</p>
      <p class="result" id="result">TIE IT SHUT. PULL TO TEST.</p>
      <p class="state visually-hidden" id="state">SLACK</p>
    </section>
    <button id="reset" class="reset" type="button">RESET BUNDLE</button>
  </aside>
</main>
<script type="module" src="cinch.js"></script>
</body>
</html>
