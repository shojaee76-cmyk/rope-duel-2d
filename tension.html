<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TENSION / FIELD - The Rope Duel</title>
<meta name="description" content="A live-data rope-balancing duel. Read the tape, catch the signal, keep the field taut.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111820'/%3E%3Cpath d='M4 23 16 8l12 15' fill='none' stroke='%231b61d6' stroke-width='3'/%3E%3Ccircle cx='16' cy='8' r='3' fill='%23f24e35'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tension.css">
</head>
<body>
<div class="instrument" id="instrument">
  <header class="masthead">
    <div class="identity">
      <p class="eyebrow">FIELD PROTOCOL / 01</p>
      <h1>TENSION<span>/</span>FIELD</h1>
    </div>
    <div class="telemetry">
      <p class="mode" id="mode">BTC / USDT</p>
      <p class="price"><span id="price">----</span><small>USDT/BTC</small></p>
      <p class="provider" id="provider">WAITING</p>
    </div>
  </header>

  <main class="field-shell">
    <section class="field-label field-label-a">
      <p class="label">PLAYER / BLUE</p>
      <p class="label-note">YOU CONTROL IT</p>
    </section>
    <section class="field-label field-label-b">
      <p class="label">TAPE / RED</p>
      <p class="label-note">LIVE PRESSURE</p>
    </section>
    <canvas id="field" aria-label="A live rope field. Tap or drag the signal node before it expires."></canvas>
    <div class="field-crosshair" aria-hidden="true"></div>
    <p class="field-prompt" id="prompt">CATCH THE RING</p>
  </main>

  <footer class="console">
    <div class="readout flow-readout">
      <p class="label">FLOW SIGNAL</p>
      <p class="flow-line"><span id="flow">WAITING</span><strong id="flow-value">0%</strong></p>
    </div>
    <div class="readout score-readout">
      <p class="label">FIELD SCORE</p>
      <p class="score-line"><span id="score">00000</span><strong id="combo">0X</strong></p>
    </div>
    <div class="readout grade-readout">
      <p class="label">LAST CONTACT</p>
      <p class="grade-line" id="grade" data-kind="">WAITING</p>
    </div>
    <div class="protocol">
      <p class="label">PROTOCOL 01</p>
      <p id="log">THE FIELD IS LISTENING</p>
    </div>
  </footer>
  <p class="footnote"><span>LIVE TAPE / SIM FALLBACK</span><span>NO WALLET / CLICK RING</span></p>
</div>
<script src="tension.js"></script>
</body>
</html>
