<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TENSION TRESTLE - tune the rope, hold the load</title>
<meta name="description" content="Tune a physical rope trestle. Set the cleats and cinch, then release the test cart across the plank.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="trestle.css">
</head>
<body>
<canvas id="trestle" aria-label="A physical A-frame rope test bench with two ground cleats, two top sheaves, a continuous sling, and a brass test cart on a rail"></canvas>
<header class="masthead">
  <div><p class="kicker">LOAD STUDY / 01</p><h1>TENSION TRESTLE</h1></div>
  <div class="air"><span id="feed-mode">WAITING FOR AIR</span><b id="pressure">STILL</b></div>
</header>
<main class="hud">
  <p class="instruction" id="instruction" aria-live="polite">DRAG THE CLEATS · SET THE CINCH · RELEASE THE CART</p>
  <div class="readout"><span id="status">EDIT · ADJUST</span><b id="phase">EDIT</b></div>
</main>
<footer class="footer">
  <div><span>ROPE</span><b id="support">ADJUST</b></div>
  <div><span>CINCH</span><b id="cinch-value">28%</b></div>
  <p>R / RESET TRESTLE</p>
</footer>
<p class="boot" id="boot">SETTING THE BENCH</p>
<script type="module" src="trestle.js"></script>
</body>
</html>
