<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE BELL ROUTE - a rope rigging puzzle</title>
<meta name="description" content="A physical theatre rigging puzzle. Route the line through the guides, lift the brass bell, and open the curtain.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="rig.css">
</head>
<body>
<canvas id="stage" aria-label="A physical rope rig with two marionettes and a brass stage bell"></canvas>

<header class="topbar">
  <div class="titleblock">
    <p class="eyebrow">PHYSICAL STUDY / 03</p>
    <h1>THE BELL ROUTE</h1>
  </div>
  <div class="readout">
    <span id="mode">WAITING FOR TAPE</span>
    <b id="price">----</b>
  </div>
</header>

<main class="scene-ui">
  <div class="instruction" id="instruction">DRAG THE TWO RINGS. FIND THE ROUTE.</div>
  <div class="bell-status" id="bell-status"><span>THE BELL IS WAITING</span><b id="bell-state">LOW</b></div>
</main>

<footer class="transport">
  <div class="metric"><span>WIND</span><b id="wind">00</b></div>
  <div class="metric"><span>LINE</span><b id="line-state">SLACK</b></div>
  <div class="metric"><span>STAGE</span><b id="stage-state">DARK</b></div>
  <p class="hint">RING A / RING B / THE BELL</p>
</footer>

<p class="boot" id="boot">SETTING THE RIG</p>
<script type="module" src="rig.js"></script>
</body>
</html>
