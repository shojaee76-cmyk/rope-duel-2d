<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE ROPE THEATRE - keep the line alive</title>
<meta name="description" content="A kinetic rope theatre. Pull the living line, let it sing, and keep the marionettes in resonance.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="theatre.css">
</head>
<body>
<canvas id="stage" aria-label="A living rope with Sultan Bigotes and Don Gato hanging from it"></canvas>

<header class="topbar">
  <div class="titleblock">
    <p class="eyebrow">KINETIC STUDY / 02</p>
    <h1>THE ROPE THEATRE</h1>
  </div>
  <div class="readout">
    <span id="mode">WAITING FOR TAPE</span>
    <b id="price">----</b>
  </div>
</header>

<main class="scene-ui">
  <section class="identity left">
    <span class="tag">SULTAN</span>
    <span class="role">HELD BY YOU</span>
  </section>
  <section class="identity right">
    <span class="role">FOLLOWING THE TAPE</span>
    <span class="tag">DON GATO</span>
  </section>
  <div class="instruction" id="instruction">DRAG THE LINE. LET IT RING.</div>
  <div class="resonance" aria-live="polite"><span id="state">FINDING THE PULL</span><b id="strain">0%</b></div>
</main>

<footer class="transport">
  <div class="metric"><span>LINE ENERGY</span><b id="energy">00</b></div>
  <div class="metric"><span>RESONANCE</span><b id="resonance">000</b></div>
  <div class="metric"><span>WIND</span><b id="wind">00</b></div>
  <p class="hint">PULL / RELEASE / LISTEN</p>
</footer>

<p class="boot" id="boot">THREADING THE LINE</p>
<script type="module" src="theatre.js"></script>
</body>
</html>
