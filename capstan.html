<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROPE CAPSTAN - take the load</title>
<meta name="description" content="Turn a rope capstan, set the tension, and hoist one brass test load into the catch.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="capstan.css">
</head>
<body>
<main class="app">
  <section class="machine" aria-label="Rope capstan machine">
    <canvas id="capstan" aria-label="A large rope capstan wheel with a visible rope wrap, one hanging brass load, a catch platform, and a brake control"></canvas>
    <p class="hoist-caption" aria-hidden="true">VERTICAL HOIST / ONE LOAD</p>
    <p class="boot" id="boot">SETTING THE LOAD</p>
  </section>
  <aside class="dock">
    <header class="masthead">
      <div><p class="kicker">LOAD STUDY / 02</p><h1>ROPE CAPSTAN</h1></div>
      <div class="air"><span id="air-mode">WAITING FOR AIR</span><b id="air">STILL</b></div>
    </header>
    <div class="brief">
      <p class="instruction" id="instruction" aria-live="polite">TURN THE WHEEL · SET THE TENSION · PRESS BRAKE</p>
      <div class="readout"><span>LOAD TENSION</span><b id="tension">0.35</b></div>
    </div>
    <footer class="footer">
      <div><span>PHASE</span><b id="phase">EDIT</b></div>
      <div><span>STATUS</span><b id="status">WIND THE CAPSTAN</b></div>
      <button class="reset" id="reset" type="button">RESET CAPSTAN</button>
      <p>R / RESET CAPSTAN</p>
    </footer>
  </aside>
</main>
<script type="module" src="capstan.js"></script>
</body>
</html>
