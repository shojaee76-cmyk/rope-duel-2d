<head>

<body>
<div class="candbar bottom"><a href="c1.html">1<span class="lg"> &middot; The Rope</span><span class="sh">Rope</span></a><a href="c2.html">2<span class="lg"> &middot; The Bridge</span><span class="sh">Bridge</span></a><a class="on" href="c3.html">3<span class="lg"> &middot; The Ring</span><span class="sh">Ring</span></a></div>

<div class="wrap">
  <main class="stage" id="stage">
    <canvas id="ring" aria-label="Two cat duelists in a spotlight ring; the buy and sell shares of live BTC/USDT order flow are the health bars"></canvas>

    <div class="c3-hud">
      <div class="c3-bars">
        <div class="c3-fighter l">
          <p class="nm">Don Gato &middot; sell</p>
          <div class="bar sell"><span id="bar-sell"></span></div>
          <div class="c3-num"><span class="l" id="pct-sell">0%</span><span class="act" id="act-sell"></span></div>
        </div>
        <div class="c3-clock">
          <p class="rnd" id="round">ROUND 1</p>
          <p class="tm" id="clock">05:00</p>
        </div>
        <div class="c3-fighter r">
          <p class="nm">Sultan Bigotes &middot; buy</p>
          <div class="bar buy"><span id="bar-buy"></span></div>
          <div class="c3-num"><span class="act" id="act-buy"></span><span class="r" id="pct-buy">0%</span></div>
        </div>
      </div>
    </div>

    <div class="c3-price" style="display:none"><p class="p" id="price">-</p><p class="s">BTC/USDT &middot; <span id="tps">0</span> trades/s &middot; <span class="chg" id="chg">-</span></p></div>
    <div class="badge" id="badge" style="position:absolute;left:16px;bottom:44px;z-index:5"><span class="dot"></span><span id="badge-text">Connecting</span></div>
    <div style="display:none"><span id="pt-price"></span></div>
  </main>
</div>

<div class="boot" id="boot"><span>Turning up the house lights</span></div>
